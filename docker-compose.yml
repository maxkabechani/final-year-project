services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cl3
      POSTGRES_USER: cl3
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cl3-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cl3 -d cl3"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://cl3:${POSTGRES_PASSWORD}@db:5432/cl3
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080"

volumes:
  cl3-postgres:
