name: Smart Access CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android app and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        working-directory: mobile
        run: flutter create --platforms=android --org dev.maxkabechani --project-name smart_access .
      - name: Add Android permissions
        working-directory: mobile
        run: python3 tool/prepare_android.py
      - name: Resolve Flutter packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze and test
        working-directory: mobile
        run: |
          dart format lib test
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub
      - name: Build Smart Access APK
        working-directory: mobile
        run: |
          flutter build apk --debug --no-pub --dart-define=API_BASE_URL=https://api-project.maxkabechani.dev
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/Smart-Access.apk
      - name: Upload Smart Access APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Access-APK
          path: mobile/build/app/outputs/flutter-apk/Smart-Access.apk
          if-no-files-found: error
          retention-days: 30

  firmware:
    name: Smart lock firmware compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio
      - run: pio run -d firmware

  backend:
    name: Fastify API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run build
      - run: bun test test/*.test.ts

  frontend:
    name: TanStack dashboard checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
