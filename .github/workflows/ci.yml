name: Smart Access CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.pdf'
      - '**/*.ppt'
      - '**/*.pptx'
      - '**/*.doc'
      - '**/*.docx'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.pdf'
      - '**/*.ppt'
      - '**/*.pptx'
      - '**/*.doc'
      - '**/*.docx'
  workflow_dispatch:

# Concurrency is scoped per component job below. A newer mobile change can
# cancel a stale mobile build, but a backend-only push cannot cancel an APK
# build that is already running.

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      firmware: ${{ steps.filter.outputs.firmware }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'mobile/**'
            firmware:
    name: ESP32 firmware and binary
    concurrency:
      group: smart-access-firmware-${{ github.ref }}
      cancel-in-progress: true
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and firmware libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli lib install "WebSockets@2.7.3"
      - name: Compile canonical Smart Access firmware
        run: |
          mkdir -p firmware/build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --output-dir firmware/build \
            firmware/SmartAccessLock
      - name: Upload compiled ESP32 firmware
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Access-ESP32-Firmware
          path: firmware/build/
          if-no-files-found: error
          retention-days: 30

  backend:
    name: Fastify API checks
    concurrency:
      group: smart-access-backend-${{ github.ref }}
      cancel-in-progress: true
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run build
      - run: bun test test/*.test.ts

  frontend:
    name: TanStack dashboard checks
    concurrency:
      group: smart-access-frontend-${{ github.ref }}
      cancel-in-progress: true
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
