name: Smart Access CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.pdf'
      - '**/*.ppt'
      - '**/*.pptx'
      - '**/*.doc'
      - '**/*.docx'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.pdf'
      - '**/*.ppt'
      - '**/*.pptx'
      - '**/*.doc'
      - '**/*.docx'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      firmware: ${{ steps.filter.outputs.firmware }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'mobile/lib/**'
              - 'mobile/test/**'
              - 'mobile/pubspec.*'
              - 'mobile/android/**'
              - 'mobile/.metadata'
              - 'mobile/tool/prepare_android.py'
              - 'mobile/tool/build_android.py'
            ios:
              - 'mobile/lib/**'
              - 'mobile/test/**'
              - 'mobile/pubspec.*'
              - 'mobile/ios/**'
              - 'mobile/.metadata'
              - 'mobile/tool/prepare_ios.py'
            firmware:
              - 'firmware/**'
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'

  android:
    name: Android app and APK
    concurrency:
      group: smart-access-android-${{ github.ref }}
      cancel-in-progress: true
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        working-directory: mobile
        run: flutter create --platforms=android --org dev.maxkabechani --project-name smart_access .
      - name: Add Android permissions
        working-directory: mobile
        run: python3 tool/prepare_android.py
      - name: Resolve Flutter packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze and test
        working-directory: mobile
        run: |
          dart format lib test
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub
      - name: Build Smart Access APK
        working-directory: mobile
        run: python3 tool/build_android.py
      - name: Upload Smart Access APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Access-APK
          path: mobile/build/app/outputs/flutter-apk/Smart-Access*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Access-Android-Symbols
          path: mobile/build/android-symbols/
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS app and unsigned IPA
    concurrency:
      group: smart-access-ios-${{ github.ref }}
      cancel-in-progress: true
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ios == 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show selected Xcode version
        run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project files
        working-directory: mobile
        run: flutter create --platforms=ios --org dev.maxkabechani --project-name smart_access .
      - name: Add iOS permission descriptions
        working-directory: mobile
        run: python3 tool/prepare_ios.py
      - name: Resolve Flutter packages
        working-directory: mobile
        run: flutter pub get
      - name: Build unsigned iOS app
        working-directory: mobile
        run: flutter build ios --release --no-codesign --no-pub --dart-define=API_BASE_URL=https://api-project.maxkabechani.dev
      - name: Package unsigned IPA
        working-directory: mobile
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          (cd build/ios/ipa && ditto -c -k --sequesterRsrc --keepParent Payload Smart-Access.ipa)
          test -s build/ios/ipa/Smart-Access.ipa
      - name: Upload Smart Access iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Access-iOS-IPA
          path: mobile/build/ios/ipa/Smart-Access.ipa
          if-no-files-found: error
          retention-days: 30

  publish-android:
    name: Publish Android download
    needs: [changes, android]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.android.result == 'success' || (needs.android.result == 'skipped' && needs.changes.outputs.android == 'false')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: smart-access-android-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve a successful APK matching the mobile source
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p apk
          gh api --paginate "repos/${GH_REPO}/actions/artifacts?name=Smart-Access-APK&per_page=100" \
            --jq '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main") | [.id, .workflow_run.head_sha] | @tsv' > candidates.tsv
          while IFS=$'\t' read -r artifact_id source_sha; do
            if git cat-file -e "${source_sha}^{commit}" 2>/dev/null && \
              git diff --quiet "$source_sha" "$GITHUB_SHA" -- mobile/lib mobile/test mobile/pubspec.yaml mobile/pubspec.lock mobile/android mobile/.metadata mobile/tool/prepare_android.py mobile/tool/build_android.py; then
              gh api "repos/${GH_REPO}/actions/artifacts/${artifact_id}/zip" > apk.zip
              unzip -q apk.zip -d apk
              test -s apk/Smart-Access.apk
              test -s apk/Smart-Access-armeabi-v7a.apk
              test -s apk/Smart-Access-x86_64.apk
              echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < candidates.tsv
          echo '::error::No unexpired APK matches the current mobile source. Run Smart Access CI on main to build one.'
          exit 1
      - name: Publish APK for the dashboard download and QR code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_SOURCE_SHA: ${{ steps.apk.outputs.source_sha }}
        run: |
          set -euo pipefail
          report_release_error() {
            status=$?
            if test -s release-error.log; then
              message=$(tail -10 release-error.log)
              message=${message//%/%25}
              message=${message//$'\r'/%0D}
              message=${message//$'\n'/%0A}
              echo "::error::${message}"
            fi
            exit "$status"
          }
          trap report_release_error ERR
          tag="android-${APK_SOURCE_SHA}"
          cat > release-notes.md <<EOF
          Smart Access Android demo APK built from commit ${APK_SOURCE_SHA}.

          Release-mode APKs with separate CPU architectures:
          - Smart-Access.apk: ARM64 phones (recommended).
          - Smart-Access-armeabi-v7a.apk: older 32-bit Android phones.
          - Smart-Access-x86_64.apk: x86-64 Android emulators.

          These are direct-install project testing builds using the generated Android template signing configuration.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" apk/Smart-Access*.apk --clobber 2>release-error.log
            gh release edit "$tag" --latest --notes-file release-notes.md 2>release-error.log
          else
            gh release create "$tag" apk/Smart-Access*.apk \
              --target "$GITHUB_SHA" --latest \
              --title "Smart Access Android" --notes-file release-notes.md 2>release-error.log
          fi

  firmware:
    name: ESP32 firmware and binary
    concurrency:
      group: smart-access-firmware-${{ github.ref }}
      cancel-in-progress: true
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and firmware libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli lib install "WebSockets"
      - name: Compile canonical Smart Access firmware
        run: |
          mkdir -p firmware/build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --output-dir firmware/build \
            firmware/SmartAccessLock
      - name: Upload compiled ESP32 firmware
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Access-ESP32-Firmware
          path: firmware/build/
          if-no-files-found: error
          retention-days: 30

  backend:
    name: Fastify API checks
    concurrency:
      group: smart-access-backend-${{ github.ref }}
      cancel-in-progress: true
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_access_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_access_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:integration-test-only@127.0.0.1:5432/smart_access_test
      BETTER_AUTH_URL: http://localhost:8080
      BETTER_AUTH_SECRET: integration-test-only-secret-at-least-32-characters
      BETTER_AUTH_OWNER_EMAIL: owner@example.test
      BETTER_AUTH_OWNER_PASSWORD: integration-test-only-password
      CREDENTIAL_MASTER_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      CORS_ORIGIN: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install
      - run: bun run typecheck
      - run: bun run build
      - run: bun test test/*.test.ts
      - name: Start test API
        run: |
          bun run start > "$RUNNER_TEMP/smart-access-api.log" 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: bun run test:integration

  frontend:
    name: TanStack dashboard checks
    concurrency:
      group: smart-access-frontend-${{ github.ref }}
      cancel-in-progress: true
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
  publish-ios:
    name: Publish iOS download
    needs: [changes, ios]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: smart-access-ios-release
      cancel-in-progress: false
    steps:
      - name: Download iOS IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Smart-Access-iOS-IPA
          path: ios-release
      - name: Publish iOS test build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > ios-release-notes.md <<EOF
          Smart Access iOS testing IPA built from commit $GITHUB_SHA.

          This IPA is unsigned. Import it into AltStore Classic to sign and install it on an iPhone.
          EOF
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release upload ios-latest ios-release/Smart-Access.ipa --clobber
            gh release edit ios-latest --title "Smart Access iOS Test Build" --notes-file ios-release-notes.md --prerelease
          else
            gh release create ios-latest ios-release/Smart-Access.ipa \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Smart Access iOS Test Build" \
              --notes-file ios-release-notes.md
          fi
