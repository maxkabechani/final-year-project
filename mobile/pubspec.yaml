name: cl3_access
description: Offline-first BLE access app for the UNZA CL3 smart door project.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  device_info_plus: ^13.3.0
  flutter_blue_plus: ^2.3.14
  flutter_secure_storage: ^11.2.0
  http: ^1.5.0
  local_auth: ^3.0.2
  permission_handler: ^12.0.1
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
